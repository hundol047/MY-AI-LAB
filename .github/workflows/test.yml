name: Application tests
on:
  push:
    branches-ignore: [live-data]  # 기상특보 파일만 있는 브랜치
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-planner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: travel-planner/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:services
