# 매주 월요일 아침(한국 시간 09:17) 한국관광공사 행사정보에서 강원 축제 날짜를 확인하고,
# 국토교통부 TAGO 버스노선정보로 장소 근처 시내·농어촌버스(첫차·막차·배차)를 다시 만든다.
# 테스트를 통과하면 검토 PR 없이 main에 바로 반영하고 앱(APK)도 다시 만든다.
# 준비: 저장소 Settings → Secrets and variables → Actions → New repository secret
#       이름 TOUR_API_KEY, 값은 공공데이터포털 한국관광공사 국문 관광정보 서비스 Decoding 키
# 예약 실행은 기본 브랜치(main)에 이 파일이 있어야 동작한다. Actions 탭에서 "Run workflow"로 바로 돌릴 수도 있다.
name: 축제 날짜·근처 버스 갱신

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "facilities: 장애인편의시설만, toilets: 카카오맵 화장실 대조+걷기 정보만 받아 이 브랜치에 올린다"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  # 시험용: 장애인편의시설 자료만 받아, 실행한 브랜치에 그대로 올린다 (main에는 손대지 않는다)
  facilities-only:
    if: inputs.only == 'facilities'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-planner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 건물별 장애인 편의시설 (한국사회보장정보원)
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/bake-facilities.mjs
      - name: 실행한 브랜치에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/facilities.json reports/facilities.md
          git diff --cached --quiet && exit 0
          git commit -q -m "Update building accessibility facilities"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"

  # 카카오맵 화장실 대조 + 걷기 정보 다시 조사 (실행한 브랜치에 그대로 올린다)
  toilets-only:
    if: inputs.only == 'toilets'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-planner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: travel-planner/package-lock.json
      - run: npm ci
      - name: 카카오맵 화장실 받기
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: node scripts/bake-kakao-toilets.mjs
      - name: 걷기 정보 다시 조사 (확인된 화장실만 센다)
        run: node scripts/bake-walk-info.mjs
      - name: 실행한 브랜치에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kakao-toilets.json public/toilets-confirmed.json public/walk-info.json reports/walk-info.md
          git diff --cached --quiet && exit 0
          git commit -q -m "Cross-check toilets with Kakao Map"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"

  update:
    if: inputs.only != 'facilities' && inputs.only != 'toilets'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-planner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: travel-planner/package-lock.json
      - name: 키 확인
        id: key
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          if [ -n "$TOUR_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          msg="저장소 Secrets에 TOUR_API_KEY가 없어 이번 갱신을 건너뜁니다. GitHub 저장소 Settings → Secrets and variables → Actions → New repository secret에서 이름 TOUR_API_KEY로 Decoding 키를 넣어 주세요. (Claude 클라우드 환경 설정의 키는 GitHub Actions에 전달되지 않습니다.)"
          echo "::warning::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - name: 패키지 설치
        if: steps.key.outputs.ok == 'true'
        run: npm ci
      - name: 축제 날짜 갱신
        if: steps.key.outputs.ok == 'true'
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/update-festivals.mjs --write
      - name: 장소 근처 버스 (TAGO 버스노선정보)
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/bake-bus.mjs
      - name: 주차 정보 (관광공사 소개정보)
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/bake-parking.mjs
      - name: 장소 근처 주차장 (전국주차장정보표준데이터)
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/bake-parking-lots.mjs
      - name: 장소 근처 공중화장실 (전국공중화장실표준데이터 · 장소 3D 화면의 공식 화장실)
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/bake-toilets.mjs
      - name: 건물별 장애인 편의시설 (한국사회보장정보원 장애인편의시설 현황 · 활용신청 필요)
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/bake-facilities.mjs
      - name: 카카오맵 화장실 받기 (오픈스트리트맵 화장실 대조용 · Secrets의 KAKAO_REST_KEY가 있을 때만)
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: if [ -n "$KAKAO_REST_KEY" ]; then node scripts/bake-kakao-toilets.mjs; else echo "::notice::KAKAO_REST_KEY가 없어 카카오맵 대조를 건너뜁니다 (정부 자료 화장실만 표시)"; fi
      - name: 장소 주변 걷기 정보 조사 (계단·화장실·걷는 길 경사 · 인증키 필요 없음)
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        run: node scripts/bake-walk-info.mjs
      - name: 장소 사진 여러 장 (관광공사 추가 사진 · 3D 화면의 실내·사진)
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/bake-gallery.mjs
      - name: 데이터가 바뀌었는지 확인
        id: diff
        if: steps.key.outputs.ok == 'true'
        run: |
          # 리포트 날짜만 바뀐 경우에는 반영하지 않는다
          if git diff --quiet -- public/data.js public/bus.json public/parking.json public/parking-lots.json public/toilets.json public/walk-info.json public/toilets-confirmed.json data/kakao-toilets.json public/gallery.json public/facilities.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "바뀐 축제·버스 없음" >> "$GITHUB_STEP_SUMMARY"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: 일정 엔진 테스트 (바뀐 데이터로)
        if: steps.diff.outputs.changed == 'true'
        run: npm test
      - name: main에 반영 (바뀐 게 있을 때만)
        if: steps.diff.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/commit-data.sh "Update festival dates and nearby bus routes" travel-planner/public/data.js travel-planner/reports/festivals.md travel-planner/public/bus.json travel-planner/reports/bus.md travel-planner/public/parking.json travel-planner/reports/parking.md travel-planner/public/parking-lots.json travel-planner/reports/parking-lots.md travel-planner/public/toilets.json travel-planner/reports/toilets.md travel-planner/public/walk-info.json travel-planner/reports/walk-info.md travel-planner/public/toilets-confirmed.json travel-planner/data/kakao-toilets.json travel-planner/public/gallery.json travel-planner/reports/gallery.md travel-planner/public/facilities.json travel-planner/reports/facilities.md
