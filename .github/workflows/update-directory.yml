name: 공식 장소·운영정보 갱신
on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
# 검토 PR 없이 테스트를 통과하면 main에 바로 반영하고, 앱(APK)도 다시 만든다
permissions:
  contents: write
  actions: write
concurrency:
  group: update-directory
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 키 확인
        id: key
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          if [ -n "$TOUR_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          msg="저장소 Secrets에 TOUR_API_KEY가 없어 이번 갱신을 건너뜁니다. GitHub 저장소 Settings → Secrets and variables → Actions → New repository secret에서 이름 TOUR_API_KEY로 Decoding 키를 넣어 주세요. (Claude 클라우드 환경 설정의 키는 GitHub Actions에 전달되지 않습니다.)"
          echo "::warning::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - name: 공식 데이터 수집
        if: steps.key.outputs.ok == 'true'
        working-directory: travel-planner
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/sync-directory.mjs
      - name: 운영시간 차이 확인
        if: steps.key.outputs.ok == 'true'
        # 하루 호출 한도를 넘으면 리포트를 바꾸지 않고 실패한다. 그래도 장소 목록 PR은 만든다
        continue-on-error: true
        working-directory: travel-planner
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/check-hours.mjs
      - name: 오가는 길 시간표 (열차·고속·시외버스)
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        working-directory: travel-planner
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/bake-transit.mjs
      - name: 패키지 설치·테스트 (바뀐 데이터로)
        if: steps.key.outputs.ok == 'true'
        working-directory: travel-planner
        run: |
          git diff --quiet -- public reports && { echo "바뀐 데이터 없음" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          npm ci && npm test
      - name: main에 반영
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/commit-data.sh "Refresh official tourism directory, operating hours and timetables" travel-planner/public/directory.json travel-planner/reports/hours.md travel-planner/public/transit.json travel-planner/reports/transit.md
