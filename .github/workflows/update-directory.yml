name: 공식 장소·운영정보 갱신
on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-directory
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 키 확인
        id: key
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          if [ -n "$TOUR_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          msg="저장소 Secrets에 TOUR_API_KEY가 없어 이번 갱신을 건너뜁니다. GitHub 저장소 Settings → Secrets and variables → Actions → New repository secret에서 이름 TOUR_API_KEY로 Decoding 키를 넣어 주세요. (Claude 클라우드 환경 설정의 키는 GitHub Actions에 전달되지 않습니다.)"
          echo "::warning::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - name: 공식 데이터 수집
        if: steps.key.outputs.ok == 'true'
        working-directory: travel-planner
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/sync-directory.mjs
      - name: 운영시간 차이 확인
        if: steps.key.outputs.ok == 'true'
        # 하루 호출 한도를 넘으면 리포트를 바꾸지 않고 실패한다. 그래도 장소 목록 PR은 만든다
        continue-on-error: true
        working-directory: travel-planner
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/check-hours.mjs
      - if: steps.key.outputs.ok == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-directory
          title: 공식 장소 및 운영정보 갱신
          commit-message: Refresh official tourism directory and operating information
          body: 관광공사 원문을 갱신합니다. 일정 엔진의 계절별 운영시간과 임시 휴장은 리포트를 검토한 뒤 반영하세요.
          add-paths: |
            travel-planner/public/directory.json
            travel-planner/reports/hours.md
