<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <script>
    // 스타일시트보다 먼저 둔다 (뒤에 두면 스타일시트를 다 받을 때까지 화면이 멈춤)
    // 일본어·중국어 화면: 그 언어 자료를 앱 코드와 함께 바로 받기 시작하고, 번역될 때까지 글자를 숨긴다 (최대 3초)
    (function () {
      var l; try { l = localStorage.getItem("lang"); } catch (e) {}
      if (!l) { var n = (navigator.languages && navigator.languages[0]) || navigator.language || ""; l = /^ja\b/i.test(n) ? "ja" : /^zh\b/i.test(n) ? "zh" : ""; }
      if (l !== "ja" && l !== "zh") return;
      ["i18n-cjk.js", "knowledge-intl.js"].forEach(function (f) { var k = document.createElement("link"); k.rel = "modulepreload"; k.href = f; document.head.appendChild(k); });
      document.documentElement.classList.add("i18n-wait");
      setTimeout(function () { document.documentElement.classList.remove("i18n-wait"); }, 3000);
    })();
  </script>
  <style>.i18n-wait body { visibility: hidden; }</style>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>오늘강원</title>
  <meta name="theme-color" content="#0b5e6b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="preconnect" href="https://router.project-osrm.org" crossorigin>
  <link rel="preconnect" href="https://tong.visitkorea.or.kr">
  <link rel="preconnect" href="https://ko.wikipedia.org" crossorigin>
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
  <link rel="modulepreload" href="planner.js">
  <link rel="modulepreload" href="data.js">
  <link rel="modulepreload" href="i18n.js">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="오늘강원">
  <meta name="description" content="고르기만 하면 영업시간까지 맞춘 강원도 여행 일정">
  <link rel="stylesheet" href="vendor/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button class="brand" id="home" type="button"><span class="dot"></span><span data-i18n>오늘강원</span></button>
    <div class="top-right">
      <div class="top-actions" id="topActions" hidden>
        <button class="ghost" id="shareBtn" type="button" data-i18n>링크 공유</button>
        <button class="ghost" id="icsBtn" type="button" data-i18n>캘린더 저장</button>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ko" lang="ko" aria-label="한국어"><span class="full">한국어</span><span class="short">한</span></button>
        <button type="button" data-lang="en" lang="en" aria-label="English"><span class="full">EN</span><span class="short">EN</span></button>
        <button type="button" data-lang="ja" lang="ja" aria-label="日本語"><span class="full">日本語</span><span class="short">日</span></button>
        <button type="button" data-lang="zh" lang="zh-Hans" aria-label="中文"><span class="full">中文</span><span class="short">中</span></button>
      </div>
    </div>
  </header>

  <!-- 1. 조건 선택 -->
  <main id="setup" class="setup">
    <section class="hero" id="hero">
      <div class="hero-photo" id="heroPhoto" aria-hidden="true"></div>
      <p class="hero-caption" id="heroCaption" hidden></p>
      <div class="hero-text">
        <h1 data-i18n>강원 여행 일정,<br>고르기만 하세요</h1>
      </div>
    </section>

    <form class="card ai-start" id="aiStart">
      <span class="ai-badge">AI</span>
      <input id="aiStartInput" maxlength="200" data-i18n-ph placeholder="예) 주말에 부모님이랑 속초 1박" autocomplete="off">
      <button type="submit" data-i18n>만들기</button>
    </form>

    <section class="card past" id="past" hidden></section>

    <form class="card form" id="form">
      <div class="field">
        <span class="label" data-i18n>어디로</span>
        <div class="seg wrap" data-name="region">
          <button type="button" data-v="gangneung" class="on" data-i18n>강릉·동해</button>
          <button type="button" data-v="seorak" data-i18n>속초·양양</button>
          <button type="button" data-v="chuncheon" data-i18n>춘천·철원</button>
          <button type="button" data-v="pyeongchang" data-i18n>평창·정선</button>
          <button type="button" data-v="wonju" data-i18n>원주</button>
        </div>
      </div>

      <div class="field">
        <label class="label" for="date" data-i18n>언제</label>
        <div class="row">
          <input type="date" id="date" class="date" required>
          <div class="seg wrap days" data-name="days">
            <button type="button" data-v="1" data-i18n>당일</button>
            <button type="button" data-v="2" class="on" data-i18n>1박 2일</button>
            <button type="button" data-v="3" data-i18n>2박 3일</button>
            <button type="button" data-v="4" data-i18n>3박 4일</button>
            <button type="button" data-v="5" data-i18n>4박 5일</button>
          </div>
        </div>
      </div>

      <div class="field">
        <span class="label" data-i18n>누구와</span>
        <div class="seg" data-name="who">
          <button type="button" data-v="solo" data-i18n>혼자</button>
          <button type="button" data-v="couple" class="on" data-i18n>연인·친구</button>
          <button type="button" data-v="family" data-i18n>아이와</button>
          <button type="button" data-v="parents" data-i18n>부모님과</button>
        </div>
      </div>

      <div class="field">
        <span class="label" data-i18n>좋아하는 것 <em>여러 개 가능</em></span>
        <div class="chips" data-name="likes">
          <button type="button" data-v="sea" class="on" data-i18n>바다</button>
          <button type="button" data-v="cafe" class="on" data-i18n>카페</button>
          <button type="button" data-v="food" data-i18n>맛집</button>
          <button type="button" data-v="culture" data-i18n>역사·문화</button>
          <button type="button" data-v="nature" data-i18n>자연·산책</button>
        </div>
      </div>

      <div class="field">
        <span class="label" data-i18n>이동</span>
        <div class="seg wrap" data-name="move">
          <button type="button" data-v="car" class="on" data-i18n>자동차</button>
          <button type="button" data-v="taxi" data-i18n>택시</button>
          <button type="button" data-v="transit" data-i18n>대중교통·도보</button>
        </div>
      </div>

      <div class="field start-field">
        <div class="start-row">
          <span class="label" data-i18n>출발</span>
          <b id="startLabel"></b>
          <button type="button" class="ghost small" id="startEdit" aria-expanded="false" data-i18n>출발지 바꾸기</button>
        </div>
        <div class="start-panel" id="startPanel" hidden>
          <div class="start-acts">
            <button type="button" class="ghost small" id="startGps" data-i18n>지금 위치에서</button>
            <button type="button" class="ghost small" id="startDefault" data-i18n>기본(권역 역·터미널)</button>
          </div>
          <input id="startSearch" type="search" maxlength="40" autocomplete="off" data-i18n-ph placeholder="출발지 검색 (예: 서울역, 경포, 동서울)">
          <ul class="start-results" id="startResults"></ul>
          <label class="start-time"><span data-i18n>첫날 출발 시각</span>
            <select id="startTime">
              <option value="" data-i18n>자동</option>
              <option>06:00</option><option>07:00</option><option>08:00</option><option>09:00</option><option>10:00</option><option>11:00</option><option>12:00</option>
            </select>
          </label>
          <p class="start-note" data-i18n>고른 출발지는 이 기기에 저장돼요. 자동: 가까우면 10시, 멀면(60km 넘게) 8시에 출발</p>
        </div>
      </div>

      <button class="primary" type="submit" data-i18n>일정 만들기</button>
    </form>
    <p class="owner-link" id="ownerLink"><a href="owner.html" data-i18n>사장님이세요? 메뉴판 사진 한 장으로 가게 등록</a></p>
  </main>

  <!-- 2. 결과 -->
  <main id="result" class="result" hidden>
    <div class="result-head">
      <div>
        <h2 id="tripTitle"></h2>
        <div class="stats" id="stats"></div>
      </div>
      <button class="ghost small" id="editBtn" type="button" data-i18n>조건 변경</button>
    </div>

    <section class="festivals" id="festivals" hidden></section>

    <section class="card lodging" id="lodgingCard" hidden></section>

    <section class="card benefits" id="benefits" hidden></section>
    <section class="card overnight" id="overnight" hidden></section>

    <nav class="tabs" id="tabs"></nav>

    <div class="adjust">
      <div class="chips quick" id="quick">
        <button type="button" data-q="rain" data-i18n>비가 와요</button>
        <button type="button" data-q="lessWalk" data-i18n>덜 걷고 싶어요</button>
        <button type="button" data-q="relaxed" data-i18n>여유롭게</button>
        <button type="button" data-q="packed" data-i18n>더 알차게</button>
      </div>
    </div>

    <section class="card guide" id="guide">
      <div class="guide-head"><span class="ai-badge" data-i18n>AI 가이드</span></div>
      <div class="guide-log" id="guideLog"></div>
      <div class="chips suggest" id="suggest">
        <button type="button" data-i18n>비 오면 어떡해?</button>
        <button type="button" data-i18n>아이랑 가도 괜찮을까?</button>
        <button type="button" data-i18n>오늘 운영시간 알려줘</button>
      </div>
      <form class="ask" id="askForm">
        <input id="askInput" maxlength="200" data-i18n-ph placeholder="예) 2일차에 바다 한 곳 더 넣어줘" autocomplete="off">
        <button type="submit" data-i18n>보내기</button>
      </form>
    </section>

    <div class="layout">
      <ol class="timeline" id="timeline"></ol>
      <div class="map-wrap"><div id="map"></div></div>
    </div>
    <section class="card shops" id="shops" hidden></section>
    <section class="card souvenirs" id="souvenirs" hidden></section>
    <section class="card costs" id="costs" hidden></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
